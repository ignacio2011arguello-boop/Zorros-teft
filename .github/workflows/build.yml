name: apk
on: [push, workflow_dispatch]
jobs:
  b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - uses: gradle/actions/setup-gradle@v3
        with: {gradle-version: 8.7}
      - run: |
          mkdir -p app/src/main/java/com/hazball/mobile app/src/main/assets
          cat > settings.gradle <<'EOF'
          pluginManagement{repositories{google();mavenCentral();gradlePluginPortal()}}
          dependencyResolutionManagement{repositories{google();mavenCentral()}}
          rootProject.name="HazBall"
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins{id 'com.android.application' version '8.5.2' apply false}
          EOF
          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          EOF
          cat > app/build.gradle <<'EOF'
          plugins{id 'com.android.application'}
          android{
            namespace 'com.hazball.mobile'
            compileSdk 34
            defaultConfig{applicationId 'com.hazball.mobile';minSdk 24;targetSdk 34;versionCode 2;versionName '2.0'}
            compileOptions{sourceCompatibility JavaVersion.VERSION_17;targetCompatibility JavaVersion.VERSION_17}
          }
          dependencies{
            implementation 'androidx.webkit:webkit:1.11.0'
            implementation 'androidx.core:core:1.13.1'
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <application android:label="HazBall" android:hardwareAccelerated="true" android:theme="@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen">
              <activity android:name=".MainActivity" android:exported="true"
                android:screenOrientation="sensorLandscape"
                android:windowSoftInputMode="adjustResize"
                android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/hazball/mobile/MainActivity.java <<'EOF'
          package com.hazball.mobile;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;
          import android.widget.Toast;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import androidx.webkit.ScriptHandler;
          import androidx.webkit.WebViewCompat;
          import androidx.webkit.WebViewFeature;
          import java.io.ByteArrayInputStream;
          import java.io.ByteArrayOutputStream;
          import java.io.InputStream;
          import java.util.Collections;
          import org.json.JSONObject;
          public class MainActivity extends Activity {
            static final String URL = "https://www.haxball.com/play";
            static final String UA = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36";
            static final String[] ADS = {"doubleclick", "googlesyndication", "googleadservices", "adinplay", "adsbygoogle",
              "google-analytics", "googletagmanager", "amazon-adsystem", "adnxs", "taboola", "outbrain", "criteo", "pubmatic",
              "rubiconproject", "openx.net", "smartadserver", "moatads", "adsrvr", "casalemedia", "adform", "venatus",
              "nitropay", "playwire", "snigel", "freestar", "aniview", "connatix"};
            WebView game, menu;
            Pad pad;
            ScriptHandler sh;
            SharedPreferences sp;
            volatile boolean started;
            volatile boolean blockAds = true;
            long lastBack;
            ValueCallback<Uri[]> fileCb;

            class Bridge {
              @JavascriptInterface public String get() { return sp.getString("cfg", "{}"); }
              @JavascriptInterface public void save(String j) { sp.edit().putString("cfg", j).apply(); }
              @JavascriptInterface public boolean started() { return started; }
              @JavascriptInterface public void play(String j, boolean reload) {
                sp.edit().putString("cfg", j).apply();
                runOnUiThread(() -> launch(reload));
              }
              @JavascriptInterface public void quit() { runOnUiThread(() -> finish()); }
            }

            @Override protected void onCreate(Bundle b) {
              super.onCreate(b);
              getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
              if (Build.VERSION.SDK_INT >= 28)
                getWindow().getAttributes().layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
              sp = getSharedPreferences("hz", 0);
              FrameLayout root = new FrameLayout(this);
              root.setBackgroundColor(0xFF05070D);

              game = new WebView(this);
              WebSettings s = game.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setMediaPlaybackRequiresUserGesture(false);
              s.setSupportZoom(false);
              s.setUserAgentString(UA);
              game.setLayerType(View.LAYER_TYPE_HARDWARE, null);
              game.setBackgroundColor(0xFF1A2125);
              game.setWebViewClient(new WebViewClient() {
                @Override public WebResourceResponse shouldInterceptRequest(WebView v, WebResourceRequest r) {
                  if (blockAds) {
                    String h = r.getUrl().getHost();
                    if (h != null) for (String a : ADS)
                      if (h.contains(a)) return new WebResourceResponse("text/plain", "utf-8", new ByteArrayInputStream(new byte[0]));
                  }
                  return null;
                }
              });
              game.setWebChromeClient(new WebChromeClient());

              menu = new WebView(this);
              WebSettings m = menu.getSettings();
              m.setJavaScriptEnabled(true);
              m.setDomStorageEnabled(true);
              menu.setBackgroundColor(0xFF05070D);
              menu.addJavascriptInterface(new Bridge(), "HBApp");
              menu.setWebChromeClient(new WebChromeClient() {
                @Override public boolean onShowFileChooser(WebView w, ValueCallback<Uri[]> cb, FileChooserParams p) {
                  if (fileCb != null) fileCb.onReceiveValue(null);
                  fileCb = cb;
                  Intent i = new Intent(Intent.ACTION_GET_CONTENT);
                  i.addCategory(Intent.CATEGORY_OPENABLE);
                  i.setType("image/*");
                  try { startActivityForResult(Intent.createChooser(i, "Elegí una imagen"), 7); }
                  catch (Exception e) { fileCb = null; return false; }
                  return true;
                }
              });
              menu.loadUrl("file:///android_asset/menu.html");

              pad = new Pad(this, game);
              pad.onSettings = this::showMenu;
              pad.setVisibility(View.GONE);

              root.addView(game, new FrameLayout.LayoutParams(-1, -1));
              root.addView(pad, new FrameLayout.LayoutParams(-1, -1));
              root.addView(menu, new FrameLayout.LayoutParams(-1, -1));
              setContentView(root);
            }

            @Override protected void onActivityResult(int rq, int rs, Intent d) {
              super.onActivityResult(rq, rs, d);
              if (rq == 7 && fileCb != null) {
                fileCb.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(rs, d));
                fileCb = null;
              }
            }

            String asset(String n) {
              try (InputStream is = getAssets().open(n)) {
                ByteArrayOutputStream bo = new ByteArrayOutputStream();
                byte[] buf = new byte[8192];
                int r;
                while ((r = is.read(buf)) > 0) bo.write(buf, 0, r);
                return bo.toString("UTF-8") + "\n;\n";
              } catch (Exception e) { return ""; }
            }

            void launch(boolean reload) {
              String cfg = sp.getString("cfg", "{}");
              try {
                JSONObject c = new JSONObject(cfg);
                JSONObject p = c.optJSONObject("pad");
                if (p != null) pad.apply((float) p.optDouble("scale", 1), (float) p.optDouble("alpha", 1), p.optBoolean("left", false), p.optBoolean("vib", true));
                JSONObject sc = c.optJSONObject("screen");
                blockAds = sc == null || sc.optBoolean("noads", true);
              } catch (Exception e) { }
              if (reload || !started) {
                if (sh != null) { sh.remove(); sh = null; }
                if (WebViewFeature.isFeatureSupported(WebViewFeature.DOCUMENT_START_SCRIPT))
                  sh = WebViewCompat.addDocumentStartJavaScript(game, "window.__HB=" + cfg + ";\n" + asset("common.js") + asset("hb.js"), Collections.singleton("*"));
                started = true;
                game.loadUrl(URL);
              }
              menu.setVisibility(View.GONE);
              menu.evaluateJavascript("window.fx&&fx(0)", null);
              pad.setVisibility(View.VISIBLE);
              game.requestFocus();
            }

            void showMenu() {
              pad.releaseAll();
              pad.setVisibility(View.GONE);
              menu.setVisibility(View.VISIBLE);
              menu.evaluateJavascript("window.fx&&fx(1)", null);
              menu.requestFocus();
            }

            void hideBars() {
              WindowInsetsControllerCompat c = WindowCompat.getInsetsController(getWindow(), getWindow().getDecorView());
              c.hide(WindowInsetsCompat.Type.systemBars());
              c.setSystemBarsBehavior(WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
            }
            @Override public void onWindowFocusChanged(boolean f) { super.onWindowFocusChanged(f); if (f) hideBars(); }
            @Override protected void onPause() { super.onPause(); game.onPause(); }
            @Override protected void onResume() { super.onResume(); game.onResume(); }
            @Override public void onBackPressed() {
              if (menu.getVisibility() != View.VISIBLE) { showMenu(); return; }
              if (started) { launch(false); return; }
              long n = System.currentTimeMillis();
              if (n - lastBack < 2000) finish();
              else { lastBack = n; Toast.makeText(this, "Toca atrás otra vez para salir", Toast.LENGTH_SHORT).show(); }
            }
          }
          EOF
          cat > app/src/main/java/com/hazball/mobile/Pad.java <<'EOF'
          package com.hazball.mobile;
          import android.content.Context;
          import android.graphics.Canvas;
          import android.graphics.Paint;
          import android.os.SystemClock;
          import android.view.HapticFeedbackConstants;
          import android.view.KeyEvent;
          import android.view.MotionEvent;
          import android.view.View;
          import android.webkit.WebView;
          public class Pad extends View {
            static final int[] KC = {KeyEvent.KEYCODE_DPAD_LEFT, KeyEvent.KEYCODE_DPAD_RIGHT, KeyEvent.KEYCODE_DPAD_UP, KeyEvent.KEYCODE_DPAD_DOWN};
            final WebView web;
            Runnable onSettings;
            boolean on = true, lf = false, vib = true;
            int jid = -1, kid = -1;
            float ox, oy, tx, ty, d, R, sc = 1, al = 1;
            final boolean[] k = new boolean[4];
            final Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);
            Pad(Context c, WebView w) {
              super(c);
              web = w;
              d = c.getResources().getDisplayMetrics().density;
              R = 60 * d;
              setFocusable(false);
              setFocusableInTouchMode(false);
            }
            void apply(float s, float a, boolean l, boolean v) {
              sc = s; al = a; lf = l; vib = v;
              R = 60 * d * sc;
              invalidate();
            }
            void key(int code, boolean down) {
              long t = SystemClock.uptimeMillis();
              web.dispatchKeyEvent(new KeyEvent(t, t, down ? KeyEvent.ACTION_DOWN : KeyEvent.ACTION_UP, code, 0));
            }
            void dirs() {
              float dx = tx - ox, dy = ty - oy, z = R * .3f;
              boolean[] n = {dx < -z, dx > z, dy < -z, dy > z};
              for (int i = 0; i < 4; i++) if (n[i] != k[i]) { k[i] = n[i]; key(KC[i], n[i]); }
            }
            void relDirs() { for (int i = 0; i < 4; i++) if (k[i]) { k[i] = false; key(KC[i], false); } }
            void releaseAll() { relDirs(); if (kid >= 0) key(KeyEvent.KEYCODE_X, false); jid = kid = -1; }
            float gx() { return getWidth() - 30 * d; }
            float ex() { return getWidth() - 76 * d; }
            float ay() { return 30 * d; }
            float kx() { return lf ? 90 * d : getWidth() - 90 * d; }
            float ky() { return getHeight() - 90 * d; }
            boolean joyZone(float x, float y) { return y > getHeight() * .3f && (lf ? x > getWidth() * .55f : x < getWidth() * .45f); }
            boolean kickZone(float x, float y) { return y > getHeight() * .3f && (lf ? x < getWidth() * .45f : x > getWidth() * .55f); }
            boolean hit(float x, float y, float cx, float cy, float r) { return Math.hypot(x - cx, y - cy) < r; }
            void col(int argb) { p.setColor(argb); p.setAlpha((int) ((argb >>> 24) * al)); }
            @Override public boolean onTouchEvent(MotionEvent e) {
              int a = e.getActionMasked(), idx = e.getActionIndex(), id = e.getPointerId(idx);
              float x = e.getX(idx), y = e.getY(idx);
              switch (a) {
                case MotionEvent.ACTION_DOWN:
                case MotionEvent.ACTION_POINTER_DOWN:
                  if (hit(x, y, gx(), ay(), 26 * d)) { if (onSettings != null) onSettings.run(); return true; }
                  if (hit(x, y, ex(), ay(), 26 * d)) { on = !on; releaseAll(); invalidate(); return true; }
                  if (!on) return false;
                  if (joyZone(x, y) && jid < 0) {
                    jid = id; ox = tx = x; oy = ty = y; invalidate(); return true;
                  }
                  if (kickZone(x, y) && kid < 0) {
                    kid = id; key(KeyEvent.KEYCODE_X, true);
                    if (vib) performHapticFeedback(HapticFeedbackConstants.KEYBOARD_TAP);
                    invalidate(); return true;
                  }
                  return false;
                case MotionEvent.ACTION_MOVE:
                  for (int i = 0; i < e.getPointerCount(); i++) if (e.getPointerId(i) == jid) {
                    tx = e.getX(i); ty = e.getY(i);
                    float dx = tx - ox, dy = ty - oy, l = (float) Math.hypot(dx, dy);
                    if (l > R) { ox += dx / l * (l - R); oy += dy / l * (l - R); }
                    dirs(); invalidate();
                  }
                  return jid >= 0 || kid >= 0;
                case MotionEvent.ACTION_UP:
                case MotionEvent.ACTION_POINTER_UP:
                case MotionEvent.ACTION_CANCEL:
                  if (id == jid) { jid = -1; relDirs(); invalidate(); }
                  if (id == kid) { kid = -1; key(KeyEvent.KEYCODE_X, false); invalidate(); }
                  return true;
              }
              return false;
            }
            @Override protected void onDraw(Canvas c) {
              p.setStyle(Paint.Style.FILL);
              p.setTextAlign(Paint.Align.CENTER);
              p.setTextSize(22 * d);
              p.setColor(0xFFFFFFFF); p.setAlpha(0x66);
              c.drawText("☰", gx(), ay() + 8 * d, p);
              c.drawText("🎮", ex(), ay() + 8 * d, p);
              if (!on) return;
              float bx = jid >= 0 ? ox : (lf ? getWidth() - 110 * d : 110 * d), by = jid >= 0 ? oy : getHeight() - 100 * d;
              p.setStyle(Paint.Style.STROKE); p.setStrokeWidth(3 * d);
              col(jid >= 0 ? 0x88FFFFFF : 0x33FFFFFF);
              c.drawCircle(bx, by, R, p);
              p.setStyle(Paint.Style.FILL);
              if (jid >= 0) { col(0x66FFFFFF); c.drawCircle(tx, ty, 26 * d * sc, p); }
              col(kid >= 0 ? 0x88FFFFFF : 0x33FFFFFF);
              c.drawCircle(kx(), ky(), 44 * d * sc, p);
              col(0xCCFFFFFF); p.setTextSize(13 * d);
              c.drawText("PATEAR", kx(), ky() + 5 * d, p);
            }
          }
          EOF
          cat > app/src/main/assets/common.js <<'EOF'
          var HBX=(function(){
          var T=6.2832,PI=Math.PI;
          function rnd(n){return Math.abs(Math.sin(n*127.1)*43758.5453)%1}
          function circ(c,x,y,r){c.beginPath();c.arc(x,y,r,0,T)}
          function poly(c,x,y,R,n,o){c.beginPath();for(var i=0;i<n;i++){var a=o+i*T/n;c.lineTo(x+Math.cos(a)*R,y+Math.sin(a)*R)}c.closePath();c.fill()}
          function ring(c,x,y,r,col){c.lineWidth=Math.max(1,r*.1);c.strokeStyle=col;circ(c,x,y,r-c.lineWidth/2);c.stroke()}
          function cimg(c,im,x,y,r){c.save();circ(c,x,y,r);c.clip();c.drawImage(im,x-r,y-r,2*r,2*r);c.restore();ring(c,x,y,r,'#000')}
          function jersey(c,x,y,r,j){
            var k=j.c,p=j.pat,i,a,b,n=5,w=2*r/n;
            c.save();circ(c,x,y,r);c.clip();
            c.fillStyle=k[0];c.fillRect(x-r,y-r,2*r,2*r);
            c.save();c.fillStyle=k[1];
            if(p=='v'||p=='d'){
              if(p=='d'){c.translate(x,y);c.rotate(-.785);c.translate(-x,-y)}
              for(i=1;i<n;i+=2)c.fillRect(x-r+i*w,y-1.5*r,w,3*r);
            }else if(p=='h'){for(i=1;i<n;i+=2)c.fillRect(x-1.5*r,y-r+i*w,3*r,w)}
            else if(p=='half')c.fillRect(x,y-r,r,2*r);
            else if(p=='check'){for(a=0;a<4;a++)for(b=0;b<4;b++)if((a+b)%2)c.fillRect(x-r+a*r/2,y-r+b*r/2,r/2,r/2)}
            c.restore();
            if(j.num){c.fillStyle=k[2];c.font='bold '+(r*1.15)+'px sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText(String(j.num).slice(0,2),x,y)}
            c.restore();
            ring(c,x,y,r,k[2]);
          }
          function aura(c,x,y,r,a,t){
            var ty=a.type;if(!ty||ty=='none')return;
            var s=a.size,col=a.color,i,k,ph,an,d,z,px,py,f,R=r*(1.2+.35*s);
            t=t*a.speed;
            c.save();c.globalCompositeOperation='lighter';c.lineCap='round';c.strokeStyle=col;c.fillStyle=col;
            if(ty=='ring'){
              for(i=0;i<3;i++){c.globalAlpha=(.55-i*.16)*(.75+.25*Math.sin(t*4));c.lineWidth=r*(.18+i*.2);circ(c,x,y,R+i*r*.05);c.stroke()}
            }else if(ty=='pulse'){
              for(i=0;i<3;i++){ph=(t*.7+i/3)%1;c.globalAlpha=(1-ph)*.8;c.lineWidth=r*.18;circ(c,x,y,r*(1+ph*1.4*s));c.stroke()}
            }else if(ty=='rainbow'){
              c.lineWidth=r*.3;c.globalAlpha=.85;
              for(i=0;i<12;i++){c.strokeStyle='hsl('+((i*30+t*120)%360)+',100%,60%)';c.beginPath();c.arc(x,y,R,i*T/12,(i+1.15)*T/12);c.stroke()}
            }else if(ty=='fire'){
              for(i=0;i<16;i++){ph=(t*1.3+i/16)%1;k=Math.sin(i*12.9+1)*r*.8;c.globalAlpha=(1-ph)*.9;c.fillStyle='hsl('+(8+ph*45)+',100%,'+(50+ph*10)+'%)';circ(c,x+k*(1-ph),y+r*.4-ph*r*2.2*s,r*.42*(1-ph*.8));c.fill()}
            }else if(ty=='bolt'){
              f=Math.floor(t*10);c.lineWidth=Math.max(1.5,r*.12);c.globalAlpha=.95;
              for(i=0;i<5;i++){
                an=rnd(f*7+i)*T;c.beginPath();c.moveTo(x+Math.cos(an)*r,y+Math.sin(an)*r);
                for(k=1;k<=4;k++){an+=(rnd(f*13+i*5+k)-.5)*.9;d=r*(1+k*.3*s);c.lineTo(x+Math.cos(an)*d,y+Math.sin(an)*d)}
                c.stroke();
              }
              c.globalAlpha=.25;c.lineWidth=r*.3;circ(c,x,y,r*1.1);c.stroke();
            }else if(ty=='stars'){
              z=r*.28;c.globalAlpha=.95;
              for(i=0;i<6;i++){
                an=t*2+i*T/6;d=R*(1+.12*Math.sin(t*3+i));px=x+Math.cos(an)*d;py=y+Math.sin(an)*d;
                c.beginPath();c.moveTo(px,py-z);c.lineTo(px+z*.35,py-z*.35);c.lineTo(px+z,py);c.lineTo(px+z*.35,py+z*.35);
                c.lineTo(px,py+z);c.lineTo(px-z*.35,py+z*.35);c.lineTo(px-z,py);c.lineTo(px-z*.35,py-z*.35);c.closePath();c.fill();
              }
            }
            c.restore();
          }
          function curves(c,x,y,r){
            c.beginPath();c.arc(x-r*1.1,y,r*.95,-.9,.9);c.stroke();
            c.beginPath();c.arc(x+r*1.1,y,r*.95,PI-.9,PI+.9);c.stroke();
          }
          function ball(c,x,y,r,b,im){
            var k=b.skin,col=b.color,i,g,u=x-r,v=y-r,w=2*r;
            if(b.photo&&im){cimg(c,im,x,y,r);return}
            if(!k||k=='classic')return;
            c.save();circ(c,x,y,r);c.clip();
            if(k=='color'){c.fillStyle=col;c.fillRect(u,v,w,w);c.fillStyle='rgba(255,255,255,.4)';circ(c,x-r*.3,y-r*.3,r*.4);c.fill()}
            else if(k=='soccer'){
              c.fillStyle='#fff';c.fillRect(u,v,w,w);c.fillStyle='#111';poly(c,x,y,r*.4,5,-1.5708);
              for(i=0;i<5;i++)poly(c,x+Math.cos(i*1.2566-1.5708)*r*1.05,y+Math.sin(i*1.2566-1.5708)*r*1.05,r*.45,5,i*1.2566);
            }else if(k=='basket'){
              c.fillStyle='#e8772e';c.fillRect(u,v,w,w);c.strokeStyle='#2b1200';c.lineWidth=Math.max(1,r*.1);
              c.beginPath();c.moveTo(x,v);c.lineTo(x,y+r);c.moveTo(u,y);c.lineTo(x+r,y);c.stroke();curves(c,x,y,r);
            }else if(k=='tennis'){
              c.fillStyle='#c6e32c';c.fillRect(u,v,w,w);c.strokeStyle='#fff';c.lineWidth=r*.16;curves(c,x,y,r);
            }else if(k=='neon'){
              c.fillStyle='#070912';c.fillRect(u,v,w,w);c.strokeStyle=col;c.lineWidth=r*.2;circ(c,x,y,r*.55);c.stroke();
            }else if(k=='fire'){
              g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,'#fff6a0');g.addColorStop(.5,'#ff9d00');g.addColorStop(1,'#e22d00');
              c.fillStyle=g;c.fillRect(u,v,w,w);
            }
            c.restore();
            ring(c,x,y,r,k=='neon'?col:'#111');
          }
          function trail(c,tr,x,y,r,b){
            var k=b.trail,i,f;
            if(!k||k=='none'){tr.length=0;return}
            tr.push([x,y]);if(tr.length>16)tr.shift();
            c.save();c.globalCompositeOperation='lighter';
            for(i=0;i<tr.length-2;i++){
              f=i/tr.length;c.globalAlpha=f*.7;
              c.fillStyle=k=='fire'?'hsl('+(10+f*40)+',100%,55%)':k=='rainbow'?'hsl('+(f*300)+',100%,60%)':b.color;
              circ(c,tr[i][0],tr[i][1],r*(.2+.8*f));c.fill();
