              if(e.classList.contains('chips')){
                mark(e,v);
                e.onclick=function(ev){var t=ev.target;if(t.dataset.v==null)return;set(k,cv(t.dataset.v));mark(e,get(k))};
              }else if(e.type=='checkbox'){e.checked=!!v;e.onchange=function(){set(k,e.checked)}}
              else{e.value=v;e.oninput=function(){set(k,e.type=='range'?+e.value:e.value)}}
            });
          }
          function render(i){
            if(i!=null)cur=i;
            $('tabs').innerHTML=TABS.map(function(t,j){return'<b class="'+(j==cur?'on':'')+'" onclick="render('+j+')">'+t[0]+' '+t[1]+'</b>'}).join('');
            $('pane').innerHTML=TABS[cur][2]();
            bind();
          }
          function pick(k){
            var f=document.createElement('input');f.type='file';f.accept='image/*';
            f.onchange=function(){
              if(!f.files[0])return;
              var fr=new FileReader();
              fr.onload=function(){
                var im=new Image();
                im.onload=function(){
                  var c=document.createElement('canvas');c.width=c.height=128;
                  var s=Math.min(im.width,im.height);
                  c.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,128,128);
                  set(k,c.toDataURL('image/jpeg',.85));
                  if(k=='photo')set('photoOn',true);
                  render();
                };
                im.src=fr.result;
              };
              fr.readAsDataURL(f.files[0]);
            };
            f.click();
          }
          function start(mode){C.auto={mode:mode};B.play(JSON.stringify(C),true);dirty=false}
          $('go').onclick=function(){
            if(B.started()&&!dirty){B.play(JSON.stringify(C),false)}
            else{C.auto={mode:'join'};B.play(JSON.stringify(C),true);dirty=false}
          };
          window.onShow=function(){$('go').textContent=(B.started()&&!dirty)?'▶ VOLVER AL JUEGO':(B.started()?'↻ APLICAR Y JUGAR':'▶ JUGAR')};

          /* preview */
          var pc=$('pv').getContext('2d'),IP=new Image(),IB=new Image(),tr=[];
          function loadImgs(){IP.src=C.photo||'';IB.src=C.ball.photo||''}
          function ok(i){return i.complete&&i.naturalWidth>0}
          function pv(t){
            var c=pc,s=t/1000,px=72,py=112,r=34,photo=C.photoOn&&ok(IP);
            c.clearRect(0,0,220,220);
            if(photo)HBX.cimg(c,IP,px,py,r);
            else if(C.jersey.on)HBX.jersey(c,px,py,r,C.jersey);
            else{c.fillStyle='#e56e56';c.beginPath();c.arc(px,py,r,0,6.2832);c.fill();c.lineWidth=3;c.strokeStyle='#000';c.stroke()}
            if(!photo){c.fillStyle='#fff';c.font='bold 20px sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText(C.avatar,px,py)}
            HBX.aura(c,px,py,r,C.aura,s);
            var bx=150+Math.cos(s*1.6)*20,by=150+Math.sin(s*1.1)*40,br=20;
            c.fillStyle='#fff';c.beginPath();c.arc(bx,by,br,0,6.2832);c.fill();c.lineWidth=2.5;c.strokeStyle='#000';c.stroke();
            HBX.trail(c,tr,bx,by,br,C.ball);
            HBX.ball(c,bx,by,br,C.ball,ok(IB)?IB:null);
          }

          /* rain */
          var FX=1,run=0,rc=$('rain'),rx=rc.getContext('2d'),W,Hh,dr=[],rp=[],fl=0;
          function rs(){W=rc.width=innerWidth;Hh=rc.height=innerHeight}
          rs();addEventListener('resize',rs);
          function nd(init){return{x:Math.random()*(W+200)-100,y:init?Math.random()*Hh:-30,l:12+Math.random()*20,v:11+Math.random()*10,a:.15+Math.random()*.4}}
          for(var q=0;q<130;q++)dr.push(nd(1));
          function loop(t){
            if(!FX){run=0;return}
            requestAnimationFrame(loop);
            rx.clearRect(0,0,W,Hh);
            if(fl>0){rx.fillStyle='rgba(190,215,255,'+fl*.2+')';rx.fillRect(0,0,W,Hh);fl-=.04}
            else if(Math.random()<.002)fl=1;
            rx.lineWidth=1.2;rx.lineCap='round';
            for(var i=0;i<dr.length;i++){
              var d=dr[i];
              rx.strokeStyle='rgba(160,200,255,'+d.a+')';rx.beginPath();rx.moveTo(d.x,d.y);rx.lineTo(d.x-d.l*.25,d.y+d.l);rx.stroke();
              d.y+=d.v;d.x-=d.v*.25;
              if(d.y>Hh){if(Math.random()<.4)rp.push({x:d.x,y:Hh-Math.random()*40,r:1,a:.5});dr[i]=nd(0)}
            }
            for(i=rp.length-1;i>=0;i--){
              var p=rp[i];
              rx.strokeStyle='rgba(160,200,255,'+p.a+')';rx.beginPath();rx.ellipse(p.x,p.y,p.r,p.r*.35,0,0,6.28);rx.stroke();
              p.r+=.8;p.a-=.02;if(p.a<=0)rp.splice(i,1);
            }
            pv(t||0);
          }
          window.fx=function(on){FX=on;if(on&&!run){run=1;requestAnimationFrame(loop)}if(on)onShow()};
          loadImgs();render(0);onShow();fx(1);
          </script></body></html>
          EOF
          gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: {name: hazball-apk, path: app/build/outputs/apk/debug/app-debug.apk}
